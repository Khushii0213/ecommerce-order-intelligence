services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./:/project
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
